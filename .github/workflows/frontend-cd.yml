name: Frontend CD

on:
  push:
    branches:
      - develop

env:
  IMAGE_NAME: ghcr.io/ngocphuoc2206/metro-station-management-frontend

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BASE_API_ENDPOINT=${{ secrets.NEXT_PUBLIC_BASE_API_ENDPOINT || 'http://15.134.61.110:8080/api/v1' }}
            NEXT_PUBLIC_USE_MOCK_AUTH=false
            NEXT_PUBLIC_AUTH_LOGIN_ENDPOINT=${{ secrets.NEXT_PUBLIC_AUTH_LOGIN_ENDPOINT || '/auth/login' }}
            NEXT_PUBLIC_AUTH_INTROSPECT_ENDPOINT=${{ secrets.NEXT_PUBLIC_AUTH_INTROSPECT_ENDPOINT || '/auth/introspect' }}
            NEXT_PUBLIC_AUTH_REFRESH_ENDPOINT=${{ secrets.NEXT_PUBLIC_AUTH_REFRESH_ENDPOINT || '/auth/refresh' }}
            NEXT_PUBLIC_AUTH_LOGOUT_ENDPOINT=${{ secrets.NEXT_PUBLIC_AUTH_LOGOUT_ENDPOINT || '/auth/logout' }}
            NEXT_PUBLIC_USERS_ENDPOINT=${{ secrets.NEXT_PUBLIC_USERS_ENDPOINT || '/users' }}
            NEXT_PUBLIC_USER_ME_ENDPOINT=${{ secrets.NEXT_PUBLIC_USER_ME_ENDPOINT || '/users/me' }}
            NEXT_PUBLIC_MY_PROFILE_ENDPOINT=${{ secrets.NEXT_PUBLIC_MY_PROFILE_ENDPOINT || '/my/profile' }}
            NEXT_PUBLIC_MY_PASSWORD_ENDPOINT=${{ secrets.NEXT_PUBLIC_MY_PASSWORD_ENDPOINT || '/my/password' }}
            NEXT_PUBLIC_MY_SETTINGS_ENDPOINT=${{ secrets.NEXT_PUBLIC_MY_SETTINGS_ENDPOINT || '/my/settings' }}
            NEXT_PUBLIC_MY_AVATAR_ENDPOINT=${{ secrets.NEXT_PUBLIC_MY_AVATAR_ENDPOINT || '/my/avatar' }}
            NEXT_PUBLIC_ADMIN_DEVICES_ENDPOINT=${{ secrets.NEXT_PUBLIC_ADMIN_DEVICES_ENDPOINT || '/admin/devices' }}
            NEXT_PUBLIC_STAFF_DEVICES_ENDPOINT=${{ secrets.NEXT_PUBLIC_STAFF_DEVICES_ENDPOINT || '/staff/devices' }}
            NEXT_PUBLIC_STAFF_GATES_ENDPOINT=${{ secrets.NEXT_PUBLIC_STAFF_GATES_ENDPOINT || '/staff/gates' }}
            NEXT_PUBLIC_STAFF_GATE_SCAN_ENDPOINT=${{ secrets.NEXT_PUBLIC_STAFF_GATE_SCAN_ENDPOINT || '/staff/gates/scan' }}
            NEXT_PUBLIC_STAFF_GATE_LOGS_ENDPOINT=${{ secrets.NEXT_PUBLIC_STAFF_GATE_LOGS_ENDPOINT || '/staff/gates/logs' }}
            NEXT_PUBLIC_ROUTES_ENDPOINT=${{ secrets.NEXT_PUBLIC_ROUTES_ENDPOINT || '/routes' }}
            NEXT_PUBLIC_ADMIN_ROUTES_ENDPOINT=${{ secrets.NEXT_PUBLIC_ADMIN_ROUTES_ENDPOINT || '/routes/admin' }}
            NEXT_PUBLIC_STATIONS_ENDPOINT=${{ secrets.NEXT_PUBLIC_STATIONS_ENDPOINT || '/stations' }}
            NEXT_PUBLIC_ADMIN_STATIONS_ENDPOINT=${{ secrets.NEXT_PUBLIC_ADMIN_STATIONS_ENDPOINT || '/admin/stations' }}
            NEXT_PUBLIC_FARE_CALCULATE_ENDPOINT=${{ secrets.NEXT_PUBLIC_FARE_CALCULATE_ENDPOINT || '/fares/calculate' }}
            NEXT_PUBLIC_ADMIN_FARES_ENDPOINT=${{ secrets.NEXT_PUBLIC_ADMIN_FARES_ENDPOINT || '/admin/fares' }}
            NEXT_PUBLIC_TICKET_TYPES_ENDPOINT=${{ secrets.NEXT_PUBLIC_TICKET_TYPES_ENDPOINT || '/ticket-types' }}
            NEXT_PUBLIC_ADMIN_TICKET_TYPES_ENDPOINT=${{ secrets.NEXT_PUBLIC_ADMIN_TICKET_TYPES_ENDPOINT || '/admin/ticket-types' }}
            NEXT_PUBLIC_ORDERS_ENDPOINT=${{ secrets.NEXT_PUBLIC_ORDERS_ENDPOINT || '/orders' }}
            NEXT_PUBLIC_ORDER_PREVIEW_ENDPOINT=${{ secrets.NEXT_PUBLIC_ORDER_PREVIEW_ENDPOINT || '/orders/preview' }}
            NEXT_PUBLIC_ORDER_STATUS_ENDPOINT=${{ secrets.NEXT_PUBLIC_ORDER_STATUS_ENDPOINT || '/orders/status' }}
            NEXT_PUBLIC_PAYMENTS_ENDPOINT=${{ secrets.NEXT_PUBLIC_PAYMENTS_ENDPOINT || '/payments' }}
            NEXT_PUBLIC_PAYMENT_INIT_ENDPOINT=${{ secrets.NEXT_PUBLIC_PAYMENT_INIT_ENDPOINT || '/payments/init' }}
            NEXT_PUBLIC_PAYMENT_CALLBACK_ENDPOINT=${{ secrets.NEXT_PUBLIC_PAYMENT_CALLBACK_ENDPOINT || '/payments/callback' }}
            NEXT_PUBLIC_MY_TICKETS_ENDPOINT=${{ secrets.NEXT_PUBLIC_MY_TICKETS_ENDPOINT || '/my/tickets' }}
            NEXT_PUBLIC_PERMISSIONS_MATRIX_ENDPOINT=${{ secrets.NEXT_PUBLIC_PERMISSIONS_MATRIX_ENDPOINT || '/permissions/matrix' }}
            NEXT_PUBLIC_PERMISSION_ROLES_ENDPOINT=${{ secrets.NEXT_PUBLIC_PERMISSION_ROLES_ENDPOINT || '/permissions/roles' }}
            NEXT_PUBLIC_MEDIA_UPLOAD_ENDPOINT=${{ secrets.NEXT_PUBLIC_MEDIA_UPLOAD_ENDPOINT || '/media/upload' }}

      - name: Deploy frontend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/metronext
            export APP_PORT="${{ secrets.APP_PORT || '3000' }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose pull frontend
            docker compose up -d --force-recreate --no-deps frontend
            docker compose ps
            docker compose images frontend
            docker image prune -f
