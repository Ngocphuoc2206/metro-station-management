server:
  port: 8080

app:
  upload:
    max-file-size: 5MB
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp

storage:
  s3:
    bucket: ${S3_BUCKET:metro-management-ticket}
    access-key: ${S3_ACCESS_KEY:''}
    secret-key: ${S3_SECRET_KEY:''}
    region: ${S3_REGION:ap-southeast-2}
    public-base-url: ${S3_PUBLIC_BASE_URL:https://metro-management-ticket.s3.ap-southeast-2.amazonaws.com}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:metro-management-ticket}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect


  jackson:
    default-property-inclusion: non_null

jwt:
  signerKey: ${JWT_SECRET:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}
  valid-duration: 3600 # in second
  refreshable-duration: 36000 # in second

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never