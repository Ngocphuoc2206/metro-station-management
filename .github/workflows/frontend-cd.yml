name: Deploy Frontend

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          test -n "${{ secrets.GHCR_TOKEN }}" || (echo "GHCR_TOKEN is missing" && exit 1)
          test -n "${{ secrets.GHCR_USERNAME }}" || (echo "GHCR_USERNAME is missing" && exit 1)
          test -n "${{ secrets.EC2_HOST }}" || (echo "EC2_HOST is missing" && exit 1)
          test -n "${{ secrets.EC2_USER }}" || (echo "EC2_USER is missing" && exit 1)
          test -n "${{ secrets.EC2_SSH_KEY }}" || (echo "EC2_SSH_KEY is missing" && exit 1)

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/ngocphuoc2206/metro-station-management-frontend:latest" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BASE_API_ENDPOINT="${{ vars.NEXT_PUBLIC_BASE_API_ENDPOINT }}" \
            --build-arg NEXT_PUBLIC_USE_MOCK_AUTH="false" \
            -t $IMAGE_NAME .

      - name: Push Docker image
        run: docker push $IMAGE_NAME

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/metronext
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -f
