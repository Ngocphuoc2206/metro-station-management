server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/managementMetro_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
