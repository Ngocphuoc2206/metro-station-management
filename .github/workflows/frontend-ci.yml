name: Frontend CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint if exists
        run: npm run lint --if-present

      - name: Build frontend
        env:
          NEXT_PUBLIC_BASE_API_ENDPOINT: http://localhost:8080/api/v1
          NEXT_PUBLIC_USE_MOCK_AUTH: false
        run: npm run build

      - name: Build Docker image for CI
        run: docker build -t metro-frontend:ci .