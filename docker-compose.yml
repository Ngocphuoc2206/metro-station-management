services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_API_ENDPOINT: ${NEXT_PUBLIC_BASE_API_ENDPOINT:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_USE_MOCK_AUTH: ${NEXT_PUBLIC_USE_MOCK_AUTH:-false}
        NEXT_PUBLIC_AUTH_LOGIN_ENDPOINT: ${NEXT_PUBLIC_AUTH_LOGIN_ENDPOINT:-/auth/login}
        NEXT_PUBLIC_AUTH_INTROSPECT_ENDPOINT: ${NEXT_PUBLIC_AUTH_INTROSPECT_ENDPOINT:-/auth/introspect}
        NEXT_PUBLIC_AUTH_REFRESH_ENDPOINT: ${NEXT_PUBLIC_AUTH_REFRESH_ENDPOINT:-/auth/refresh}
        NEXT_PUBLIC_AUTH_LOGOUT_ENDPOINT: ${NEXT_PUBLIC_AUTH_LOGOUT_ENDPOINT:-/auth/logout}
        NEXT_PUBLIC_USERS_ENDPOINT: ${NEXT_PUBLIC_USERS_ENDPOINT:-/users}
        NEXT_PUBLIC_USER_ME_ENDPOINT: ${NEXT_PUBLIC_USER_ME_ENDPOINT:-/users/me}
        NEXT_PUBLIC_MY_PROFILE_ENDPOINT: ${NEXT_PUBLIC_MY_PROFILE_ENDPOINT:-/my/profile}
        NEXT_PUBLIC_MY_PASSWORD_ENDPOINT: ${NEXT_PUBLIC_MY_PASSWORD_ENDPOINT:-/my/password}
        NEXT_PUBLIC_MY_SETTINGS_ENDPOINT: ${NEXT_PUBLIC_MY_SETTINGS_ENDPOINT:-/my/settings}
        NEXT_PUBLIC_MY_AVATAR_ENDPOINT: ${NEXT_PUBLIC_MY_AVATAR_ENDPOINT:-/my/avatar}
        NEXT_PUBLIC_ADMIN_DEVICES_ENDPOINT: ${NEXT_PUBLIC_ADMIN_DEVICES_ENDPOINT:-/admin/devices}
        NEXT_PUBLIC_STAFF_DEVICES_ENDPOINT: ${NEXT_PUBLIC_STAFF_DEVICES_ENDPOINT:-/staff/devices}
        NEXT_PUBLIC_STAFF_GATES_ENDPOINT: ${NEXT_PUBLIC_STAFF_GATES_ENDPOINT:-/staff/gates}
        NEXT_PUBLIC_STAFF_GATE_SCAN_ENDPOINT: ${NEXT_PUBLIC_STAFF_GATE_SCAN_ENDPOINT:-/staff/gates/scan}
        NEXT_PUBLIC_STAFF_GATE_LOGS_ENDPOINT: ${NEXT_PUBLIC_STAFF_GATE_LOGS_ENDPOINT:-/staff/gates/logs}
        NEXT_PUBLIC_ROUTES_ENDPOINT: ${NEXT_PUBLIC_ROUTES_ENDPOINT:-/routes}
        NEXT_PUBLIC_ADMIN_ROUTES_ENDPOINT: ${NEXT_PUBLIC_ADMIN_ROUTES_ENDPOINT:-/routes/admin}
        NEXT_PUBLIC_STATIONS_ENDPOINT: ${NEXT_PUBLIC_STATIONS_ENDPOINT:-/stations}
        NEXT_PUBLIC_ADMIN_STATIONS_ENDPOINT: ${NEXT_PUBLIC_ADMIN_STATIONS_ENDPOINT:-/admin/stations}
        NEXT_PUBLIC_FARE_CALCULATE_ENDPOINT: ${NEXT_PUBLIC_FARE_CALCULATE_ENDPOINT:-/fares/calculate}
        NEXT_PUBLIC_ADMIN_FARES_ENDPOINT: ${NEXT_PUBLIC_ADMIN_FARES_ENDPOINT:-/admin/fares}
        NEXT_PUBLIC_TICKET_TYPES_ENDPOINT: ${NEXT_PUBLIC_TICKET_TYPES_ENDPOINT:-/ticket-types}
        NEXT_PUBLIC_ADMIN_TICKET_TYPES_ENDPOINT: ${NEXT_PUBLIC_ADMIN_TICKET_TYPES_ENDPOINT:-/admin/ticket-types}
        NEXT_PUBLIC_ORDERS_ENDPOINT: ${NEXT_PUBLIC_ORDERS_ENDPOINT:-/orders}
        NEXT_PUBLIC_ORDER_PREVIEW_ENDPOINT: ${NEXT_PUBLIC_ORDER_PREVIEW_ENDPOINT:-/orders/preview}
        NEXT_PUBLIC_ORDER_STATUS_ENDPOINT: ${NEXT_PUBLIC_ORDER_STATUS_ENDPOINT:-/orders/status}
        NEXT_PUBLIC_PAYMENTS_ENDPOINT: ${NEXT_PUBLIC_PAYMENTS_ENDPOINT:-/payments}
        NEXT_PUBLIC_PAYMENT_INIT_ENDPOINT: ${NEXT_PUBLIC_PAYMENT_INIT_ENDPOINT:-/payments/init}
        NEXT_PUBLIC_PAYMENT_CALLBACK_ENDPOINT: ${NEXT_PUBLIC_PAYMENT_CALLBACK_ENDPOINT:-/payments/callback}
        NEXT_PUBLIC_MY_TICKETS_ENDPOINT: ${NEXT_PUBLIC_MY_TICKETS_ENDPOINT:-/my/tickets}
        NEXT_PUBLIC_PERMISSIONS_MATRIX_ENDPOINT: ${NEXT_PUBLIC_PERMISSIONS_MATRIX_ENDPOINT:-/permissions/matrix}
        NEXT_PUBLIC_PERMISSION_ROLES_ENDPOINT: ${NEXT_PUBLIC_PERMISSION_ROLES_ENDPOINT:-/permissions/roles}
        NEXT_PUBLIC_MEDIA_UPLOAD_ENDPOINT: ${NEXT_PUBLIC_MEDIA_UPLOAD_ENDPOINT:-/media/upload}
    container_name: metro-management-ticket-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
