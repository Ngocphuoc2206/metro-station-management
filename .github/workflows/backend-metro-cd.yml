name: Deploy Backend

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${OWNER}/${REPO}:latest"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Push Docker image
        run: docker push $IMAGE_NAME

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/metronext
            cat > .env <<EOF
            SERVER_PORT=${{ secrets.SERVER_PORT || '8080' }}
            DB_HOST=${{ secrets.DB_HOST || 'mysql' }}
            DB_PORT=${{ secrets.DB_PORT || '3306' }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MOCK_WEBHOOK_SECRET=${{ secrets.MOCK_WEBHOOK_SECRET }}
            S3_BUCKET=${{ secrets.S3_BUCKET || 'metro-management-ticket' }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            S3_REGION=${{ secrets.S3_REGION || 'ap-southeast-2' }}
            S3_PUBLIC_BASE_URL=${{ secrets.S3_PUBLIC_BASE_URL || 'https://metro-management-ticket.s3.ap-southeast-2.amazonaws.com' }}
            REDIS_HOST=${{ secrets.REDIS_HOST || 'redis' }}
            REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}
            BACKEND_IMAGE=${{ steps.image.outputs.image_name }}
            EOF
            cat > docker-compose.deploy.yml <<'EOF'
            services:
              backend:
                image: ${BACKEND_IMAGE}
                container_name: metro-backend
                restart: unless-stopped
                ports:
                  - "${SERVER_PORT:-8080}:8080"
                env_file:
                  - .env
            EOF
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker system prune -af
            docker compose -f docker-compose.deploy.yml pull backend
            docker compose -f docker-compose.deploy.yml up -d backend
            docker image prune -f
